<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Laytekz</title>
  <!--
    Laytekz app icon, master artwork (used for 128 px and up).
    macOS grid: 1024 canvas, 824 x 824 continuous-corner tile at (100, 100).
    A galley proof (one long sheet of set type, running off the bottom of the
    tile) with a single proofreader's caret pointing up into a gap in a line.
    Hand-hinted sources for the small sizes are in icon-sources/: icon-16/32/48/64
    (macOS grid) and win-16/24/32/48/64 (Windows grid, tile at 87.5% of the
    canvas). Windows 128 and 256 use this file with viewBox="41 41 942 942"
    and no tile shadow.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#363940"/>
      <stop offset="1" stop-color="#191a1e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="168" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#e9e4d8"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="sheetShadow" x="-25%" y="-10%" width="150%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <path id="tileShape" d="M627.36 100c103.83 0 155.75 0 195.41 20.21a185.4 185.4 0 0 1 81.02 81.02c20.21 39.66 20.21 91.58 20.21 195.41L924 627.36c0 103.83 0 155.75-20.21 195.41a185.4 185.4 0 0 1-81.02 81.02c-39.66 20.21-91.58 20.21-195.41 20.21L396.64 924c-103.83 0-155.75 0-195.41-20.21a185.4 185.4 0 0 1-81.02-81.02c-20.21-39.66-20.21-91.58-20.21-195.41L100 396.64c0-103.83 0-155.75 20.21-195.41a185.4 185.4 0 0 1 81.02-81.02c39.66-20.21 91.58-20.21 195.41-20.21Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
  </defs>

  <!-- tile -->
  <use href="#tileShape" fill="url(#tile)" filter="url(#tileShadow)"/>

  <g clip-path="url(#tileClip)">
    <!-- the galley: a long sheet that runs on past the bottom of the tile -->
    <rect x="332" y="168" width="360" height="800" rx="14" fill="url(#paper)" filter="url(#sheetShadow)"/>

    <!-- set lines: 36 thick on an 84 pitch, two paragraphs and the start of a third -->
    <g fill="#33363d">
      <rect x="380" y="236" width="264" height="36" rx="18"/>
      <rect x="380" y="320" width="264" height="36" rx="18"/>
      <rect x="380" y="404" width="166" height="36" rx="18"/>
      <rect x="598" y="404" width="46" height="36" rx="18"/>
      <rect x="380" y="488" width="84" height="36" rx="18"/>
      <rect x="420" y="572" width="224" height="36" rx="18"/>
      <rect x="380" y="656" width="264" height="36" rx="18"/>
      <rect x="380" y="740" width="196" height="36" rx="18"/>
      <rect x="420" y="824" width="224" height="36" rx="18"/>
      <rect x="380" y="908" width="264" height="36" rx="18"/>
    </g>
  </g>

  <!-- edge light, so the dark tile holds its shape on a dark Dock -->
  <use href="#tileShape" fill="none" stroke="url(#rim)" stroke-width="5" clip-path="url(#tileClip)"/>

  <!-- the proofreader's caret: a pen stroke with a sharp apex in the word gap, easing slightly toward round feet -->
  <path d="M496.5 522.1 572 435.1 647.5 522.1a13 13 0 0 1-19 17.8L572 484.7 515.5 539.9a13 13 0 0 1-19-17.8Z" fill="#ef4a3a"/>
</svg>
