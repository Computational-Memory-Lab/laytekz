<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <title>Laytekz (48 px)</title>
  <!--
    Simplified Laytekz icon for 48 px, drawn on the 48 px grid. Same macOS grid
    as ../icon.svg (tile 38.625 px at 4.6875); six 2 px lines on a 5 px pitch.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="4.6875" x2="0" y2="43.3125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#363940"/>
      <stop offset="1" stop-color="#191a1e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="4.6875" x2="0" y2="43.3125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="8" x2="0" y2="43.3125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#e9e4d8"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0.45" stdDeviation="0.55" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="sheetShadow" x="-25%" y="-10%" width="150%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0.45" stdDeviation="0.75" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <path id="tileShape" d="M29.41 4.6875c4.87 0 7.3 0 9.16.95a8.69 8.69 0 0 1 3.8 3.8c.95 1.86.95 4.29.95 9.16L43.3125 29.41c0 4.87 0 7.3-.95 9.16a8.69 8.69 0 0 1-3.8 3.8c-1.86.95-4.29.95-9.16.95L18.59 43.3125c-4.87 0-7.3 0-9.16-.95a8.69 8.69 0 0 1-3.8-3.8c-.95-1.86-.95-4.29-.95-9.16L4.6875 18.59c0-4.87 0-7.3.95-9.16a8.69 8.69 0 0 1 3.8-3.8c1.86-.95 4.29-.95 9.16-.95Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
  </defs>

  <use href="#tileShape" fill="url(#tile)" filter="url(#tileShadow)"/>

  <g clip-path="url(#tileClip)">
    <rect x="16" y="8" width="16" height="40" rx="0.75" fill="url(#paper)" filter="url(#sheetShadow)"/>
    <g fill="#33363d">
      <rect x="18" y="11" width="12" height="2" rx="0.5"/>
      <rect x="18" y="16" width="12" height="2" rx="0.5"/>
      <rect x="18" y="21" width="6" height="2" rx="0.5"/>
      <rect x="28" y="21" width="2" height="2" rx="0.5"/>
      <rect x="20" y="31" width="10" height="2" rx="0.5"/>
      <rect x="18" y="36" width="12" height="2" rx="0.5"/>
      <rect x="18" y="41" width="9" height="2" rx="0.5"/>
    </g>
  </g>

  <use href="#tileShape" fill="none" stroke="url(#rim)" stroke-width="1" clip-path="url(#tileClip)"/>

  <path d="M22 28 26 24 30 28" fill="none" stroke="#ef4a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4"/>
</svg>
