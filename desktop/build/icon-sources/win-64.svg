<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Laytekz for Windows (64 px)</title>
  <!--
    Windows 64 px Laytekz icon: the content of icon-64.svg on the Windows grid,
    where the tile fills 56 x 56 px (4 px margin), without the macOS drop shadow.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="4" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#363940"/>
      <stop offset="1" stop-color="#191a1e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="4" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="10" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#e9e4d8"/>
    </linearGradient>
    <filter id="sheetShadow" x="-25%" y="-10%" width="150%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0.6" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <path id="tileShape" d="M39.84 4c7.06 0 10.58 0 13.28 1.37a12.6 12.6 0 0 1 5.51 5.51c1.37 2.7 1.37 6.22 1.37 13.28L60 39.84c0 7.06 0 10.58-1.37 13.28a12.6 12.6 0 0 1-5.51 5.51c-2.7 1.37-6.22 1.37-13.28 1.37L24.16 60c-7.06 0-10.58 0-13.28-1.37a12.6 12.6 0 0 1-5.51-5.51c-1.37-2.7-1.37-6.22-1.37-13.28L4 24.16c0-7.06 0-10.58 1.37-13.28a12.6 12.6 0 0 1 5.51-5.51c2.7-1.37 6.22-1.37 13.28-1.37Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
  </defs>

  <use href="#tileShape" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <rect x="21" y="10" width="22" height="50" rx="1" fill="url(#paper)" filter="url(#sheetShadow)"/>
    <g fill="#33363d">
      <rect x="24" y="14" width="16" height="3" rx="1.5"/>
      <rect x="24" y="20" width="16" height="3" rx="1.5"/>
      <rect x="24" y="26" width="8" height="3" rx="1.5"/>
      <rect x="36" y="26" width="4" height="3" rx="1.5"/>
      <rect x="27" y="38" width="13" height="3" rx="1.5"/>
      <rect x="24" y="44" width="16" height="3" rx="1.5"/>
      <rect x="24" y="50" width="12" height="3" rx="1.5"/>
      <rect x="27" y="56" width="13" height="3" rx="1.5"/>
    </g>
  </g>

  <use href="#tileShape" fill="none" stroke="url(#rim)" stroke-width="1" clip-path="url(#tileClip)"/>

  <path d="M29.5 35.6 34 30.6 38.5 35.6" fill="none" stroke="#ef4a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4"/>
</svg>
