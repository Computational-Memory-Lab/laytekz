<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <title>Laytekz for Windows (24 px)</title>
  <!--
    Windows 24 px Laytekz icon, drawn on the 24 px grid: tile 22 x 22 px at 1 (snapped to
    whole pixels), a 12 px sheet with four 2 px lines and the 2 px pixel caret of icon-32.svg.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="0" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#383b42"/>
      <stop offset="1" stop-color="#1b1c20"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="0" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="3" x2="0" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#ebe6db"/>
    </linearGradient>
    <path id="tileShape" d="M15.08 1c2.77 0 4.16 0 5.22.54a4.95 4.95 0 0 1 2.16 2.16c.54 1.06.54 2.44.54 5.22L23 15.08c0 2.77 0 4.16-.54 5.22a4.95 4.95 0 0 1-2.16 2.16c-1.06.54-2.44.54-5.22.54L8.92 23c-2.77 0-4.16 0-5.22-.54a4.95 4.95 0 0 1-2.16-2.16c-.54-1.06-.54-2.44-.54-5.22L1 8.92c0-2.77 0-4.16.54-5.22a4.95 4.95 0 0 1 2.16-2.16c1.06-.54 2.44-.54 5.22-.54Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
  </defs>

  <use href="#tileShape" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <rect x="6" y="3" width="12" height="21" rx="0.5" fill="url(#paper)"/>
    <g fill="#33363d">
      <rect x="8" y="5" width="8" height="2" rx="0.5"/>
      <rect x="8" y="9" width="4" height="2" rx="0.5"/>
      <rect x="14" y="9" width="2" height="2" rx="0.5"/>
      <rect x="10" y="16" width="6" height="2" rx="0.5"/>
      <rect x="8" y="20" width="8" height="2" rx="0.5"/>
    </g>
  </g>

  <use href="#tileShape" fill="none" stroke="url(#rim)" stroke-width="1" clip-path="url(#tileClip)"/>

  <path d="M12 11h2v1h-2zM11 12h4v1h-4zM10 13h2v1h-2zM14 13h2v1h-2zM9 14h2v1H9zM15 14h2v1h-2z" fill="#ef4a3a" shape-rendering="crispEdges"/>
</svg>
