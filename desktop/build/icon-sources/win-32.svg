<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Laytekz for Windows (24 to 32 px)</title>
  <!--
    Windows 24 and 32 px Laytekz icon: the content of icon-32.svg on the Windows
    grid, where the tile fills 28 x 28 px (2 px margin) instead of the macOS 25.75.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="2" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#383b42"/>
      <stop offset="1" stop-color="#1b1c20"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="2" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="5" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#ebe6db"/>
    </linearGradient>
    <path id="tileShape" d="M19.92 2c3.53 0 5.29 0 6.64.69a6.3 6.3 0 0 1 2.75 2.75c.69 1.35.69 3.11.69 6.64L30 19.92c0 3.53 0 5.29-.69 6.64a6.3 6.3 0 0 1-2.75 2.75c-1.35.69-3.11.69-6.64.69L12.08 30c-3.53 0-5.29 0-6.64-.69a6.3 6.3 0 0 1-2.75-2.75c-.69-1.35-.69-3.11-.69-6.64L2 12.08c0-3.53 0-5.29.69-6.64a6.3 6.3 0 0 1 2.75-2.75c1.35-.69 3.11-.69 6.64-.69Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
  </defs>

  <use href="#tileShape" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <rect x="10" y="5" width="12" height="25" rx="0.5" fill="url(#paper)"/>
    <g fill="#33363d">
      <rect x="12" y="8" width="8" height="2" rx="0.5"/>
      <rect x="12" y="12" width="4" height="2" rx="0.5"/>
      <rect x="18" y="12" width="2" height="2" rx="0.5"/>
      <rect x="14" y="20" width="6" height="2" rx="0.5"/>
      <rect x="12" y="24" width="8" height="2" rx="0.5"/>
    </g>
  </g>

  <use href="#tileShape" fill="none" stroke="url(#rim)" stroke-width="1" clip-path="url(#tileClip)"/>

  <path d="M16 14h2v1h-2zM15 15h4v1h-4zM14 16h2v1h-2zM18 16h2v1h-2zM13 17h2v1h-2zM19 17h2v1h-2z" fill="#ef4a3a" shape-rendering="crispEdges"/>
</svg>
