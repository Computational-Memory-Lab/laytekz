<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Laytekz (24 to 32 px)</title>
  <!--
    Simplified Laytekz icon for 24 and 32 px (also the 16 pt @2x slot), drawn
    on the 32 px grid. Same macOS grid as ../icon.svg (tile 25.75 px at 3.125).
    Four 2 px lines on a 4 px pitch, a pixel-drawn 2 px caret, no shadows.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="3.125" x2="0" y2="28.875" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#383b42"/>
      <stop offset="1" stop-color="#1b1c20"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="3.125" x2="0" y2="28.875" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="5" x2="0" y2="28.875" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfbf7"/>
      <stop offset="1" stop-color="#ebe6db"/>
    </linearGradient>
    <path id="tileShape" d="M19.6 3.125c3.24 0 4.87 0 6.11.63a5.79 5.79 0 0 1 2.53 2.53c.63 1.24.63 2.86.63 6.11L28.875 19.6c0 3.24 0 4.87-.63 6.11a5.79 5.79 0 0 1-2.53 2.53c-1.24.63-2.86.63-6.11.63L12.4 28.875c-3.24 0-4.87 0-6.11-.63a5.79 5.79 0 0 1-2.53-2.53c-.63-1.24-.63-2.86-.63-6.11L3.125 12.4c0-3.24 0-4.87.63-6.11a5.79 5.79 0 0 1 2.53-2.53c1.24-.63 2.86-.63 6.11-.63Z"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
  </defs>

  <use href="#tileShape" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <rect x="10" y="5" width="12" height="25" rx="0.5" fill="url(#paper)"/>
    <g fill="#33363d">
      <rect x="12" y="8" width="8" height="2" rx="0.5"/>
      <rect x="12" y="12" width="4" height="2" rx="0.5"/>
      <rect x="18" y="12" width="2" height="2" rx="0.5"/>
      <rect x="14" y="20" width="6" height="2" rx="0.5"/>
      <rect x="12" y="24" width="8" height="2" rx="0.5"/>
    </g>
  </g>

  <use href="#tileShape" fill="none" stroke="url(#rim)" stroke-width="1" clip-path="url(#tileClip)"/>

  <path d="M16 14h2v1h-2zM15 15h4v1h-4zM14 16h2v1h-2zM18 16h2v1h-2zM13 17h2v1h-2zM19 17h2v1h-2z" fill="#ef4a3a" shape-rendering="crispEdges"/>
</svg>
