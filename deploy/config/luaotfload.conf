; Laytekz compiler: luaotfload settings, installed by setup.sh as
; ~/galley-server/compiler-home/.config/luaotfload/luaotfload.conf.
; A font name missing from the database would otherwise make every LuaLaTeX
; run rescan all of TeX Live's fonts (about a minute) and then fail anyway,
; because TeX runs may not keep a database. warm-caches.sh builds it instead.
[db]
    update-live = false
